# Application areas the daily run searches. Each area gets its own
# opportunity cards. Thermal items outside these areas can still become
# cards, tagged with area: other.
#
# Edit freely: add a query, drop one that only returns noise, or add an area.

areas:
  - id: datacentre
    name: Data-centre cooling
    why: >
      UK societal problem: data centres' energy and water use, grid capacity,
      and AI chips that exceed what air and conventional cold plates can remove.
    focus:
      - cold plates and direct-to-chip liquid cooling
      - two-phase, thermosiphon, vapour chamber and immersion cooling
      - heat rejection, chillers, dry coolers, heat reuse into district heating
      - chip-level and microfluidic cooling
    search_queries:
      - additive manufactured cold plate data centre cooling
      - two-phase direct-to-chip cooling startup
      - thermosiphon passive cooling data centre
      - immersion cooling UK
      - data centre waste heat reuse UK district heating
      - microfluidic chip cooling AI
      - generative design cold plate topology optimisation
      - Innovate UK data centre cooling project
    # Short phrases for the research and funding APIs (tools/apis.py), run on
    # all five sources. Keep them to two or three words: CORDIS and arXiv match
    # the exact phrase.
    api_queries:
      - immersion cooling
      - cold plate
      - two-phase cooling
      - direct-to-chip cooling
      - data centre cooling
      - data center cooling
      - thermosiphon
      - vapour chamber
      - microchannel cooling
      - data centre heat reuse

  - id: aerospace
    name: Aerospace heat exchangers
    why: >
      Henry's area of expertise. Cabin-air precoolers and oil coolers in
      commercial turbofans; thermal loads rise with higher bypass ratio,
      geared fans, electrification and hydrogen.
    focus:
      - bleed-air precoolers and environmental control system heat exchangers
      - air-cooled, fuel-cooled and surface oil coolers
      - additive manufactured and compact heat exchangers for aero engines
      - thermal management for hybrid-electric and hydrogen aircraft
    search_queries:
      - aircraft precooler heat exchanger
      - aero engine oil cooler additive manufacturing
      - surface air cooled oil cooler turbofan
      - ATI programme thermal management heat exchanger
      - Clean Aviation thermal management heat exchanger
      - hydrogen aircraft heat exchanger
      - compact heat exchanger aerospace additive manufactured
      - Liebherr Honeywell Collins Parker heat exchanger aerospace
    api_queries:
      - aircraft heat exchanger
      - precooler
      - oil cooler
      - air-oil heat exchanger
      - aircraft thermal management
      - hydrogen aircraft heat exchanger
      - surface cooler
      - compact heat exchanger

  - id: motorsport
    name: Motorsport thermal management
    why: >
      Henry's area of expertise. Formula One's 2026 rules (about 50% electric
      power, sustainable fuel, smaller cars) make heat rejection and packaging
      a central design problem; motorsport heat-exchanger tech often transfers
      to aerospace, automotive and data centres.
    focus:
      - radiators, intercoolers and oil coolers
      - battery and power-electronics cooling (ERS, MGU-K, Formula E)
      - brake cooling and ducting
      - AM alloys and processes approved for racing heat exchangers
    search_queries:
      - Formula 1 2026 cooling radiator thermal management
      - F1 power unit battery cooling MGU-K thermal
      - PWR additive manufactured heat exchanger
      - Conflux motorsport heat exchanger
      - motorsport 3D printed heat exchanger alloy approved
      - Formula E battery thermal management
      - F1 brake cooling duct additive manufacturing
      - motorsport thermal management technology transfer
    api_queries:
      - motorsport
      - Formula 1
      - Formula E
      - racing car radiator
      - high performance vehicle cooling

# Technology-first searches (added 2026-10-20 at ben's request). These start
# from the technology, not an area, to catch work whose application is
# implicit: a method that would suit cold plates or oil coolers even though
# the source never says so. Cards from these get whichever area fits best,
# or "other". Mark the link "inferred" when you make it.
technology_queries:
  - TPMS gyroid lattice heat exchanger experimental
  - additively manufactured heat pipe OR loop heat pipe OR pulsating heat pipe
  - copper additive manufacturing heat exchanger green laser
  - CT inspection additive heat exchanger internal channels powder removal
  - cryogenic hydrogen heat exchanger additive
  - AI generative design heat exchanger
  - laser surface texturing boiling heat transfer
  - diffusion bonded compact heat exchanger new application
  - two-phase cooling power electronics electric aircraft
  - transpiration cooling additive porous
  - topology optimisation heat sink experimental validation
  - jet impingement cooling additive manufactured
  - compact heat exchanger fusion OR microreactor OR sCO2
  - battery thermal management cold plate additive

# Technology-first phrases for the research and funding APIs, as above.
api_technology_queries:
  - additively manufactured heat exchanger
  - gyroid heat exchanger
  - TPMS heat exchanger
  - additive heat pipe
  - pulsating heat pipe
  - topology optimisation heat exchanger
  - copper laser powder bed fusion
  - heat exchanger inspection
