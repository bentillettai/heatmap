# Where the daily run looks. V1 reads these through web search and page
# reading (this environment blocks direct scraping), so each entry is a site
# to search within or a page to check, not an RSS feed.
#
# status: active (checked every run), watch (checked weekly), later (not yet)
# Many URLs on Henry's original list came from Copilot; check before relying.

